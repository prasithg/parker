[pytest]
# Spawned-thread exceptions are test failures, not warnings: the
# concurrent-session test passed while its threads crashed on the shared
# SQLite connection, and pytest still exited 0 (independent review,
# 2026-09-01). Same for exceptions raised in __del__/callbacks.
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
    error::pytest.PytestUnraisableExceptionWarning
